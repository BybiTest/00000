name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release AAB & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 LTS) for web assets build if needed
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # We don't enforce cache: 'npm' here to prevent crashes if lockfile is absent,
          # but package-lock.json is now also included in the repository.

      - name: Install Web Dependencies and Build Web Assets
        run: |
          npm install
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "./android" ]; then
            cd android && (./gradlew assembleDebug --stacktrace || gradle assembleDebug)
          else
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug
          fi

      - name: Build Android Release AAB
        run: |
          if [ -d "./android" ]; then
            cd android && (./gradlew bundleRelease --stacktrace || gradle bundleRelease || true)
          else
            (./gradlew bundleRelease --stacktrace || gradle bundleRelease || true)
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creatorflow-ai-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creatorflow-ai-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.aab
