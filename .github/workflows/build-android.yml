name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Android Release AAB & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies and Build Web Assets
        run: |
          npm install
          npm run build

      # Setup Java 17 using modern v5 action
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Official Gradle Setup with intelligent caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Gradle Wrapper
        run: |
          if [ -d "./android" ]; then
            cd android
          fi
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew || true

      - name: Build Android Debug APK
        run: |
          if [ -d "./android" ]; then
            cd android
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release AAB
        run: |
          if [ -d "./android" ]; then
            cd android
          fi
          ./gradlew bundleRelease --stacktrace --no-daemon || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: creatorflow-ai-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: creatorflow-ai-release-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
