name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Android Release AAB & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js (Node 22 LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build Web Assets & Bundle into Android Assets folders
      - name: Install Web Dependencies and Bundle Android Assets
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/*
          cp -r dist/* android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/

      # Setup Java 17 (Temurin)
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Official Gradle Setup with caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Auto-accept all Android SDK licenses instantly
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true

      # Ensure gradle-wrapper.jar exists
      - name: Prepare Gradle Wrapper
        run: |
          cd android
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading official gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x gradlew

      # Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      # Build Release AAB
      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace --no-daemon || true

      # Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: creatorflow-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Upload Release AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: creatorflow-ai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
